plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Spring Boot 4 uses JUnit 6; must match platform-launcher with engine 6.x
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'

	// Cucumber
	testImplementation 'io.cucumber:cucumber-java:7.18.0'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.18.0'
}

configurations.configureEach {
	resolutionStrategy {
		force 'org.junit.platform:junit-platform-launcher:6.0.3'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

sonar {
    properties {
        property "sonar.projectKey", "demo-calidad"
        property "sonar.projectName", "Proyecto Demo Calidad"
        property "sonar.host.url", "http://localhost:9000"
    }
}

pitest {
	pitestVersion = '1.19.4'
	junit5PluginVersion = '1.2.2'
	// Plugin auto-adds an old launcher (1.10.x) that breaks JUnit 6
	addJUnitPlatformLauncher = false

	targetClasses = ['com.example.*']
	targetTests = ['com.example.*']

	threads = 4
	outputFormats = ['HTML']
	timestampedReports = false
	verbose = true
}

test {
	useJUnitPlatform()
}

tasks.register('acceptanceTest', Test) {
	useJUnitPlatform()

	description = 'Runs Cucumber acceptance tests.'
	group = 'verification'
}

